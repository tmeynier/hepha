[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_hepha"
version = "0.1.0"
description = "LeRobot integration and MuJoCo simulation pipeline for the Hepha robot"
requires-python = ">=3.12"
dependencies = [
    "lerobot[core_scripts,feetech,training]==0.6.1",
    "mujoco>=3.3,<4",
    "numpy>=2.0,<2.3",
    "scipy>=1.14,<2",
]

[project.optional-dependencies]
pi0 = [
    "lerobot[pi]==0.6.1",
]
remote = [
    "lerobot[async]==0.6.1",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
hepha-view = "simulation.view:main"
hepha-record = "hepha_lerobot.recording.record:main"
hepha-teleop-record = "hepha_lerobot.recording.teleop:main"
hepha-physical-record = "hepha_lerobot.recording.physical_teleop:main"
hepha-calibrate = "hardware.calibrate_feetech:main"
hepha-leader-calibrate = "hardware.calibrate_feetech_positions:main"
hepha-follower-calibrate = "hardware.calibrate_feetech_follower:main"
hepha-follow = "hardware.teleoperate_feetech:main"
hepha-teleop-episode = "hardware.teleoperate_episode:main"
hepha-cnc = "hardware.control_fmc4030:main"
hepha-camera = "hardware.read_usb_camera:main"
hepha-policies = "hepha_lerobot.policies.catalog:main"
hepha-train = "hepha_lerobot.training.train:main"
hepha-evaluate = "hepha_lerobot.evaluation.rollout:main"
hepha-eval-loss = "hepha_lerobot.evaluation.offline_loss:main"
hepha-physical-rollout = "hepha_lerobot.evaluation.physical_rollout:main"
hepha-eval-grasp = "hepha_lerobot.evaluation.grasp_sweep:main"
hepha-eval-task = "hepha_lerobot.evaluation.task_sweep:main"
hepha-eval-ik = "hepha_lerobot.evaluation.ik_sweep:main"
hepha-dagger-mark = "hepha_lerobot.dagger.mark:main"
hepha-dagger-correct = "hepha_lerobot.dagger.correct:main"
hepha-dagger-merge = "hepha_lerobot.dagger.merge:main"
hepha-awr-record = "hepha_lerobot.awr.record:main"
hepha-awr-init = "hepha_lerobot.awr.initialize:main"
hepha-awr-advantages = "hepha_lerobot.awr.advantages:main"
hepha-awr-merge = "hepha_lerobot.awr.merge:main"

[tool.setuptools]
package-dir = {"" = "lerobot", "hepha_lerobot" = "lerobot", "simulation" = "simulation", "hardware" = "hardware"}
py-modules = ["lerobot_robot_hepha"]
packages = [
    "hepha_lerobot",
    "hepha_lerobot.awr",
    "hepha_lerobot.dagger",
    "hepha_lerobot.datasets",
    "hepha_lerobot.evaluation",
    "hepha_lerobot.policies",
    "hepha_lerobot.policies.hepha_act_phase",
    "hepha_lerobot.policies.hepha_act_awr",
    "hepha_lerobot.recording",
    "hepha_lerobot.training",
    "hardware",
    "simulation",
    "simulation.backends",
    "simulation.backends.mujoco",
]

[tool.setuptools.package-data]
"simulation.backends.mujoco" = [
    "assets/*.xml",
    "assets/meshes/*.stl",
]

[tool.pytest.ini_options]
addopts = "-ra -p no:capture"
testpaths = ["tests"]
markers = [
    "integration: headless end-to-end simulation tests",
    "slow: tests that run complete simulated episodes",
]

[tool.ruff]
extend-exclude = ["doc", "hardware"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
